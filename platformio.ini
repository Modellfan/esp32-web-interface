; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = Web interface for Huebner inverter
default_envs = release
src_dir = .
data_dir = data
extra_configs = platformio-local-override.ini

[common]
monitor_speed = 115200

[env]
platform = espressif32
framework = arduino
board = esp32dev
board_build.filesystem = spiffs
board_build.flash_mode = qout
board_build.partitions = default.csv   
build_src_filter = +<*> -<.git/> -<.svn/> -<src/flashloader> -<src/can_test.cpp> -<src/can_acan_test.cpp>
upload_port = COM11
upload_speed = 921600
upload_flags = 
	--after
	no_reset_stub

[env:release]
build_flags = 
	${env.build_flags}
	-D RELEASE
	-Wall -Werror
build_type = release
lib_deps = 
	fbiego/ESP32Time@^2.0.0
	adafruit/RTClib@^2.1.1
	bblanchon/ArduinoJson@^7.1.0
	bblanchon/StreamUtils@^1.7.3
	SPI

[env:debug]
build_flags = 
	${env.build_flags}
	-D DEBUG
	-DDEBUG_ESP_PORT=Serial
	-DDEBUG_ESP_CORE
	-DDEBUG_ESP_WIFI
	;-DDEBUG_CAN
	-Wall -Werror
build_type = debug
lib_deps = 
	fbiego/ESP32Time@^2.0.0
	adafruit/RTClib@^2.1.1
	bblanchon/ArduinoJson@^7.1.0
	bblanchon/StreamUtils@^1.7.3
	SPI

[env:can_test]
build_type = debug
build_src_filter = -<*> +<src/can_test.cpp>
build_flags =
	${env.build_flags}
	-DCAN_TEST_ENV
	-DCAN_TEST_RX_PIN=16
	-DCAN_TEST_TX_PIN=17
	-DCAN_TEST_BAUD=500000
	-DCAN_TEST_POLLING_RATE_MS=10
	-Wall -Werror

[env:can_acan_test]
build_type = debug
build_src_filter = -<*> +<src/can_acan_test.cpp>
build_flags =
	${env.build_flags}
	-DCAN_TEST_ENV
	-DCAN_ACAN_TEST_BIT_RATE=500000UL
	-DCAN_ACAN_TEST_TX_PIN=17
	-DCAN_ACAN_TEST_RX_PIN=16
	-DCAN_ACAN_TEST_SEND_INTERVAL_MS=500
	-Wall -Werror
lib_deps =
	pierremolinaro/ACAN_ESP32@^3.0.3